# Nurr1 리간드 × Treg 분화 논문 수집 설정
# - 수집 조건: "물질 키워드 1개 이상" AND "주제 키워드 1개 이상" (require_topics: true)
#   CQ·AQ는 다른 분야(말라리아, 오토파지, 코로나 등) 논문이 압도적으로 많아서,
#   면역/T세포 맥락이 함께 있을 때만 모읍니다.
# - 소문자 키워드는 대소문자 무시 + 뒤에 붙는 글자 허용 (autoimmun → autoimmunity)
# - 띄어쓰기 없는 대문자 약어(CQ, AQ, PGA1, TSDR 등)는 대소문자 구분 + 복수형 s만 허용
# - 공백과 하이픈은 같은 것으로 취급 ("Th 17" = "Th-17")

require_topics: true

compounds:
  quinoline: ["chloroquine", "hydroxychloroquine", "CQ", "HCQ", "amodiaquine", "AQ",
              "4-aminoquinoline", "aminoquinoline", "quinacrine", "mepacrine"]
  prostaglandin: ["prostaglandin A1", "PGA1", "prostaglandin E1", "PGE1", "alprostadil",
                  "cyclopentenone prostaglandin", "15-deoxy", "15d-PGJ2", "prostaglandin J2",
                  "PGJ2", "prostaglandin A2", "PGA2"]
  nr4a: ["Nurr1", "NR4A2", "NR4A1", "NR4A3", "Nur77", "NOR-1", "NOR1",
         "nuclear receptor 4A", "nuclear receptor related 1", "orphan nuclear receptor",
         "C-DIM12", "1,1-bis(3'-indolyl)"]

topics:
  treg: ["regulatory T", "Treg", "iTreg", "pTreg", "tTreg", "nTreg", "Foxp3", "FOXP3",
         "CD25", "IL-2 receptor alpha", "IL2RA", "CD4+CD25+", "suppressive capacity",
         "suppression assay", "immune tolerance", "tolerogenic", "peripheral tolerance"]
  t_helper: ["Th17", "Th1", "Th2", "RORgt", "RORγt", "ROR gamma t", "RORC", "T-bet", "GATA3",
             "T helper", "CD4 T cell", "CD4+ T", "naive CD4", "T cell differentiation",
             "T cell polarization", "effector T cell", "T cell exhaustion"]
  # 주의: 여기에 autophagy·NF-kB·methylation 같은 일반 세포생물학 용어를 넣으면
  # CQ의 오토파지 논문 등 비면역 논문이 대량으로 통과합니다. T세포 맥락 용어만 둡니다.
  stability: ["TSDR", "CNS2", "CNS1", "Foxp3 stability", "Foxp3 demethylat", "ex-Treg",
              "Treg stability", "lineage stability", "Treg plasticity"]
  autoimmune_model: ["autoimmun", "colitis", "inflammatory bowel", "IBD", "Crohn",
                     "experimental autoimmune encephalomyelitis", "EAE", "multiple sclerosis",
                     "collagen-induced arthritis", "rheumatoid arthritis", "lupus",
                     "graft-versus-host", "GvHD", "transplant tolerance", "allograft",
                     "type 1 diabetes", "psoriasis", "uveitis"]
  t_cell_signaling: ["TGF-beta induced", "TGF-β induced", "iTreg induction", "TCR stimulation",
                     "anti-CD3", "anti-CD28", "IL-2 signaling", "STAT5", "immunosuppress",
                     "immunomodulat", "T cell receptor signaling", "lymphocyte proliferation"]

sources:
  pubmed:
    enabled: true
    # NCBI 권장: 연락 가능한 이메일. API 키는 환경변수 NCBI_API_KEY로 넣으면 속도 제한이 완화됩니다.
    email: ""
    max_results: 5000   # 물질 키워드로만 넓게 검색하므로 넉넉하게
  biorxiv:
    enabled: true
    # 비워두면 전체 카테고리에서 키워드로 거릅니다. 예: ["immunology", "pharmacology and toxicology"]
    categories: []
  medrxiv:
    enabled: true
    categories: []   # 예: ["rheumatology", "allergy and immunology"]
